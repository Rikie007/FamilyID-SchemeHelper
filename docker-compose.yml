services:
  mongo:
    image: mongo:7
    container_name: gj-family-id-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: gj_family_id
    volumes:
      - gj_mongo_data:/data/db

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: gj-family-id-mongo-ui
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo

volumes:
  gj_mongo_data:
